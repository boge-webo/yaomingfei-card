<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>姚明飞｜杭州炽焰游创网络科技有限公司</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}.page{max-width:560px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#101010 0,#090909 42%,#15100b 100%);overflow:hidden}
.hero{position:relative;padding:42px 24px 30px;min-height:650px;display:flex;flex-direction:column;justify-content:flex-end;background:
linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.45) 55%,#0a0a0a 100%),
url("portrait.jpg") center top/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,rgba(201,38,18,.25),transparent 30%),linear-gradient(90deg,transparent 50%,rgba(0,0,0,.35));pointer-events:none}
.brand{position:absolute;top:26px;left:24px;z-index:2;display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand span{font-size:12px;letter-spacing:2px;color:#e9d2a3}
.content{position:relative;z-index:2}.eyebrow{font-size:12px;letter-spacing:4px;color:#e5b56c;margin-bottom:12px}
h1{font-size:46px;line-height:1;margin:0 0 12px;font-weight:700;letter-spacing:2px}
.role{font-size:18px;color:#ddd;margin-bottom:10px}.company{font-size:14px;line-height:1.7;color:#c7c7c7;max-width:430px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 20px 8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border:1px solid #5a4430;border-radius:15px;text-decoration:none;color:#fff;background:linear-gradient(180deg,#1d1813,#111);font-size:15px}
.btn.primary{background:linear-gradient(135deg,#b52214,#7c160f);border-color:#d85a3e}
.section{margin:14px 20px;padding:22px 20px;border:1px solid #2b241d;border-radius:20px;background:rgba(255,255,255,.035)}
.section h2{margin:0 0 14px;font-size:19px}.section p{margin:0;color:#bcbcbc;line-height:1.8;font-size:14px}
.info{display:grid;gap:13px}.row{display:flex;gap:12px;align-items:center;color:#ddd;font-size:14px}.icon{width:32px;height:32px;border-radius:10px;background:#221811;display:grid;place-items:center;color:#e8b16a}
.qr{text-align:center}.qr img{width:min(78vw,300px);border-radius:14px;background:#fff;padding:8px}.qr p{margin-top:12px;color:#aaa;font-size:13px}
.footer{text-align:center;color:#666;font-size:12px;padding:26px 20px 40px}
@media (max-width:380px){h1{font-size:40px}.hero{min-height:590px}}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="brand"><img src="logo.jpg" alt="杭州炽焰"><span>杭州炽焰</span></div>
    <div class="content">
      <div class="eyebrow">DIGITAL BUSINESS CARD</div>
      <h1>姚明飞</h1>
      <div class="role">董事长</div>
      <div class="company">杭州炽焰游创网络科技有限公司</div>
    </div>
  </section>
  <div class="actions">
    <a class="btn primary" href="tel:13735892028">☎ 立即联系</a>
    <a class="btn" href="#wechat">＋ 添加微信</a>
  </div>
  <section class="section">
    <h2>个人名片</h2>
    <div class="info">
      <div class="row"><span class="icon">👤</span><span>姚明飞｜董事长</span></div>
      <div class="row"><span class="icon">🏢</span><span>杭州炽焰游创网络科技有限公司</span></div>
      <div class="row"><span class="icon">☎</span><a href="tel:13735892028" style="color:#ddd;text-decoration:none">137 3589 2028</a></div>
      <div class="row"><span class="icon">📍</span><span>浙江 · 杭州</span></div>
    </div>
  </section>
  <section class="section qr" id="wechat">
    <h2>添加微信</h2>
    <img src="wechat-qr.jpg" alt="微信二维码">
    <p>长按识别二维码，添加微信好友</p>
  </section>
  <footer class="footer">杭州炽焰游创网络科技有限公司 · Digital Business Card</footer>
</div>
</body>
</html>
